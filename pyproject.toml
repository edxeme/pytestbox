[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytestbox"
version = "0.2.1"
description = "Run untrusted pytest suites in locked-down Docker sandboxes with hard timeouts and structured results."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edwin Martinez" }]
keywords = ["pytest", "docker", "sandbox", "testing", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]

[project.scripts]
pytestbox = "pytestbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pytestbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
